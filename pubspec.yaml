name: duewise
description: Agenda acadêmica DueWise.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_svg: ^2.3.4
  table_calendar: ^3.2.1
  intl: ^0.20.2
  sqflite: ^2.4.6
  path: ^1.9.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/dw_monogram.svg
    - assets/branding/monk_splash.webp

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/monk_launcher.png
  adaptive_icon_background: '#F6F8FB'
  adaptive_icon_foreground: assets/branding/monk_foreground.png
  min_sdk_android: 24
