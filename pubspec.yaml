name: duewise
description: Agenda acadêmica DueWise.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_svg: ^2.3.4
  table_calendar: ^3.2.1
  intl: ^0.20.2
  sqflite: ^2.4.6
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/Roboto_LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/monk_icon.png
  adaptive_icon_background: '#EAF2FA'
  adaptive_icon_foreground: assets/branding/monk_icon.png
  min_sdk_android: 24

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: '#F6F8FB'
  color_dark: '#F6F8FB'
  image: assets/branding/monk_icon.png
  image_dark: assets/branding/monk_icon.png
  android_12:
    color: '#F6F8FB'
    color_dark: '#F6F8FB'
    image: assets/branding/monk_icon.png
    image_dark: assets/branding/monk_icon.png
